# =============================================================================
# procgov.conf — Sample Configuration File for procgov.sh
# =============================================================================
# All values here are defaults. CLI flags override these at runtime.
# Lines starting with # are comments and are ignored.
# =============================================================================

# Kill a process if its CPU usage exceeds this percentage
CPU_THRESHOLD=80

# Kill a process if its memory usage exceeds this percentage
MEM_THRESHOLD=70

# A process must exceed the threshold for this many seconds before being killed
# Prevents killing processes that have brief, normal spikes
DURATION=30

# How often (in seconds) to poll the process list
# Lower = more responsive, higher = less system overhead
INTERVAL=5

# Path to the whitelist file (one process name per line)
WHITELIST_FILE=whitelist.txt

# Path to the log file where kill actions are recorded
LOG_FILE=procgov.log
